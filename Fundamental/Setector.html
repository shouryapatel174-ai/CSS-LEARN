<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>

    <style>
<!--        /* 1. Element Selector */-->
        h1 {
            color: blue;
        }

        /* 2. ID Selector */
        #intro {
            color: green;
        }

        /* 3. Class Selector */
        .highlight {
            background-color: pink;
            padding: 5px;
        }

        /* 4. Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* 5. Group Selector */
        h2, h3 {
            color: purple;
        }

        /* 6. Descendant Selector */
        .container p {
            color: #e65100;
        }

        /* 7. Pseudo-class Selector */
        button:hover {
            background-color: black;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>CSS Selectors</h1>

<p id="intro">This is an ID selector.</p>

<p class="highlight">This is a class selector.</p>

<h2>Group Selector</h2>
<h3>Another Heading</h3>

<div class="container">
    <p>This is a descendant selector.</p>
</div>

<button>Hover Over Me</button>

</body>
</html>
