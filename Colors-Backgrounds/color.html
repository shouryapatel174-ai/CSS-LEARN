<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .color-box {
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .named {
            background-color: tomato;
        }

        .hex {
            background-color: #2563eb;
        }

        .rgb {
            background-color: rgb(22, 163, 74);
        }

        .hsl {
            background-color: hsl(280, 80%, 50%);
        }
    </style>
</head>
<body>

<h1>CSS Colors</h1>

<div class="color-box named">Named Color: Tomato</div>
<div class="color-box hex">HEX Color: #2563eb</div>
<div class="color-box rgb">RGB Color: rgb(22, 163, 74)</div>
<div class="color-box hsl">HSL Color</div>

</body>
</html>
